<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="日文 Ops" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#EFE6D3" />
  <title>Japanese Ops</title>
  <!-- Plain HTML/CSS/JS: no CDN, no framework. Everything is local. -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <span class="deco" style="top: 64px; right: 32px; font-size: 2.25rem">🗾</span>
    <span class="deco" style="top: 192px; left: 24px">🍣</span>
    <span class="deco" style="bottom: 160px; right: 48px; font-size: 2.25rem">🚄</span>
    <span class="deco" style="bottom: 288px; left: 40px">🏯</span>
  </div>

  <div class="page">
    <header class="app-header">
      <h1 class="app-title">🗾 Japanese Ops <span id="offline-badge" class="offline-badge" hidden>📴 離線</span></h1>
      <p class="app-sub">日文旅行會話</p>
    </header>
    <main id="main"></main>
  </div>

  <div id="overlay"></div>
  <div id="update-banner" class="update-banner" role="status" hidden>
    <span>🆕 有新版本</span>
    <button type="button">點按更新</button>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <nav id="tabbar" class="tabbar"></nav>

  <noscript><p style="padding: 16px">請啟用 JavaScript，才能使用此 App。</p></noscript>

  <script src="./js/storage.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/speech.js"></script>
  <script src="./js/content/kana.js"></script>
  <script src="./js/kana.js"></script>
  <script src="./js/contrast.js"></script>
  <script src="./js/sounds.js"></script>
  <script src="./js/content/phrases.js"></script>
  <script src="./js/content/dialogues.js"></script>
  <script src="./js/phrases.js"></script>
  <script src="./js/listening.js"></script>
  <script src="./js/speaking.js"></script>
  <script src="./js/dialogue.js"></script>
  <script src="./js/daily.js"></script>
  <script src="./js/progress.js"></script>
  <script src="./js/backup.js"></script>
  <script src="./js/home.js"></script>
